name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
      - run: npm ci && npm run check && npm run build && npm audit --audit-level=high
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./... && go vet ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /tmp/filemind ./cmd/filemind
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: docker compose --env-file .env.example config --quiet
